version: 2

project_name: hey

before:
  hooks:
    - sh -c 'mkdir -p completions && go run ./cmd/hey completion bash > completions/hey.bash && go run ./cmd/hey completion zsh > completions/_hey && go run ./cmd/hey completion fish > completions/hey.fish'
    # release.sh commits the stable metadata stamps (plugin.json and
    # nix/package.nix) to main before tagging a stable release. Nothing here
    # can repair a tag pushed by hand without that commit (both files ship
    # from the tag, not from these archives), so a stable tag whose metadata
    # disagrees with its version fails before anything is published — the
    # pre-publication nix-verify job would otherwise reject it. Prereleases and
    # snapshots leave stable metadata on the latest stable version.
    - sh -c '{{ if or .Prerelease .IsSnapshot }}echo "Skipping stable metadata check for {{ .Version }}"{{ else }}scripts/check-stable-metadata.sh {{ .Version }}{{ end }}'
    # Authenticode-sign a copy of the PowerShell installer inside the pipeline
    # so it lands in checksums.txt (cosign-signed, provenance-attested) and on
    # the release as hey_installer.ps1. Staged outside dist/ because goreleaser
    # requires dist to be empty after before-hooks run. Unsigned copy when the
    # SM_* env is absent (forks, make test-release). Raw-main install.ps1 stays
    # unsigned and LF -- that is the `irm | iex` path, which needs neither. The
    # staging step converts to CRLF and rejects non-ASCII, without which
    # PowerShell reports HashMismatch (see the script for why both invariants
    # are load-bearing).
    - sh -c 'scripts/stage-installer-ps1.sh scripts/install.ps1 .release-extra/hey_installer.ps1 && scripts/sign-windows.sh windows .release-extra/hey_installer.ps1'

builds:
  - id: hey
    main: ./cmd/hey
    binary: hey
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
      - windows
      - freebsd
      - openbsd
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/basecamp/hey-cli/internal/version.Version={{.Version}}
      - -X github.com/basecamp/hey-cli/internal/version.Commit={{.Commit}}
      - -X github.com/basecamp/hey-cli/internal/version.Date={{.Date}}
    hooks:
      post:
        # Authenticode-sign Windows binaries in place before archiving, so the
        # zip, checksums.txt, cosign bundle, and provenance attestation all
        # cover the signed binary. No-op for non-windows targets and when the
        # SM_* signing env is absent (forks, make test-release).
        - cmd: scripts/sign-windows.sh "{{ .Target }}" "{{ .Path }}"
          output: true
        # Size gate per binary, after signing and before anything is archived
        # or published. Report-only while .size-budget has enforce = false. The
        # release workflow prints the consolidated table afterwards, so the
        # per-binary run stays out of the job summary.
        - sh -c 'GITHUB_STEP_SUMMARY= scripts/check-size-budget.sh {{ .Path }}'

archives:
  - id: default
    ids: [hey]
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE*
      - README*
      - completions/*
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt
  algorithm: sha256
  extra_files:
    - glob: .release-extra/hey_installer.ps1

sboms:
  - artifacts: archive

# Sign checksums with cosign (keyless via Sigstore).
# Requires: permissions.id-token: write in workflow for OIDC.
signs:
  - cmd: cosign
    signature: '${artifact}.bundle'
    args:
      - sign-blob
      - '--bundle=${signature}'
      # Pin the published bundle format explicitly (protobuf, v0.3+json) so it
      # no longer depends on the CI cosign default. The installers and `hey
      # upgrade` verify this format; cosign v3 defaults to it anyway, and v3
      # dropped the --output-certificate/--output-signature flags that broke
      # the v0.1.0 release.
      - '--new-bundle-format=true'
      - '${artifact}'
      - '--yes'
    artifacts: checksum
    output: true

notarize:
  macos:
    - enabled: '{{ and (ne (index .Env "MACOS_SIGN_P12") "") (ne (index .Env "MACOS_SIGN_PASSWORD") "") (ne (index .Env "MACOS_NOTARY_KEY") "") (ne (index .Env "MACOS_NOTARY_KEY_ID") "") (ne (index .Env "MACOS_NOTARY_ISSUER_ID") "") }}'
      ids: [hey]
      sign:
        certificate: '{{ index .Env "MACOS_SIGN_P12" }}'
        password: '{{ index .Env "MACOS_SIGN_PASSWORD" }}'
      notarize:
        issuer_id: '{{ index .Env "MACOS_NOTARY_ISSUER_ID" }}'
        key_id: '{{ index .Env "MACOS_NOTARY_KEY_ID" }}'
        key: '{{ index .Env "MACOS_NOTARY_KEY" }}'
        wait: true
        timeout: 20m

changelog:
  use: github-native

release:
  github:
    owner: basecamp
    name: hey-cli
  draft: false
  prerelease: auto
  make_latest: "{{ if .Prerelease }}false{{ else }}auto{{ end }}"
  replace_existing_artifacts: true
  extra_files:
    - glob: .release-extra/hey_installer.ps1
  name_template: "{{.ProjectName}} v{{.Version}}"
  header: |
    ### Install

    **macOS:**
    ```sh
    brew install --cask basecamp/tap/hey
    hey auth login
    ```

    **Arch Linux / Omarchy:**
    ```sh
    yay -S hey-cli
    hey auth login
    ```

    **Other platforms:** download the matching archive from the assets below.

homebrew_casks:
  - name: hey
    ids: [default]
    repository:
      owner: basecamp
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    directory: Casks
    homepage: "https://github.com/basecamp/hey-cli"
    description: "Command-line interface for HEY email"
    completions:
      bash: "completions/hey.bash"
      zsh: "completions/_hey"
      fish: "completions/hey.fish"
    skip_upload: auto

scoops:
  - name: hey
    ids: [default]
    repository:
      owner: basecamp
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    homepage: "https://github.com/basecamp/hey-cli"
    description: "Command-line interface for HEY email"
    license: MIT
    skip_upload: auto

nfpms:
  - id: packages
    package_name: hey-cli
    ids: [hey]
    vendor: 37signals
    homepage: "https://github.com/basecamp/hey-cli"
    maintainer: "37signals <support@37signals.com>"
    description: "Command-line interface for HEY email"
    license: MIT
    formats:
      - deb
      - rpm
      - apk
    contents:
      - src: completions/hey.bash
        dst: /usr/share/bash-completion/completions/hey
      - src: completions/_hey
        dst: /usr/share/zsh/vendor-completions/_hey
        packager: deb
      - src: completions/_hey
        dst: /usr/share/zsh/vendor-completions/_hey
        packager: apk
      - src: completions/_hey
        dst: /usr/share/zsh/site-functions/_hey
        packager: rpm
      - src: completions/hey.fish
        dst: /usr/share/fish/vendor_completions.d/hey.fish
