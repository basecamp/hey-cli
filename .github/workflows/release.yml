name: Release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  test:
    uses: ./.github/workflows/test.yml
    permissions:
      contents: read

  security:
    uses: ./.github/workflows/security.yml
    permissions:
      contents: read
      security-events: write

  release:
    name: Release
    needs: [test, security]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        # zizmor: ignore[cache-poisoning] -- cache is branch-isolated; fork PRs cannot write to this cache
        with:
          go-version-file: go.mod

      - name: Verify tag is on main
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Install Syft
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0

      - name: Verify macOS signing secrets
        run: |
          missing=()
          for var in MACOS_SIGN_P12 MACOS_SIGN_PASSWORD MACOS_NOTARY_KEY MACOS_NOTARY_KEY_ID MACOS_NOTARY_ISSUER_ID; do
            if [ -z "${!var}" ]; then
              missing+=("$var")
            fi
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "ERROR: Missing required macOS signing secrets: ${missing[*]}"
            echo "Notarization is mandatory. Configure all MACOS_* secrets before releasing."
            exit 1
          fi
        env:
          MACOS_SIGN_P12: ${{ secrets.MACOS_SIGN_P12 }}
          MACOS_SIGN_PASSWORD: ${{ secrets.MACOS_SIGN_PASSWORD }}
          MACOS_NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}

      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          repositories: homebrew-tap
          permission-contents: write

      - name: Install GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: 'v2.15.4'
          install-only: true

      - name: Run GoReleaser
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ steps.app-token.outputs.token }}
          MACOS_SIGN_P12: ${{ secrets.MACOS_SIGN_P12 }}
          MACOS_SIGN_PASSWORD: ${{ secrets.MACOS_SIGN_PASSWORD }}
          MACOS_NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
        run: goreleaser release --clean

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: ./dist/checksums.txt

      - name: Check CLI surface compatibility
        run: |
          make build
          scripts/check-cli-surface.sh ./bin/hey /tmp/current-surface.txt
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            SCRIPT_DIR="$(pwd)/scripts"
            WORKTREE_DIR=/tmp/baseline-tree
            trap 'git worktree remove "$WORKTREE_DIR" --force 2>/dev/null || true' EXIT
            git worktree add "$WORKTREE_DIR" "$PREV_TAG"
            cd "$WORKTREE_DIR"
            make build
            if "$SCRIPT_DIR/check-cli-surface.sh" ./bin/hey /tmp/baseline-surface.txt 2>/dev/null; then
              cd -
              git worktree remove "$WORKTREE_DIR" --force
              trap - EXIT
              scripts/check-cli-surface-diff.sh /tmp/baseline-surface.txt /tmp/current-surface.txt
            else
              echo "Baseline ($PREV_TAG) does not support --help --agent — skipping surface diff"
              cd -
              git worktree remove "$WORKTREE_DIR" --force
              trap - EXIT
            fi
          else
            echo "First release — no baseline to compare against"
          fi

  # The AUR goes down for maintenance often enough that a release must not
  # depend on it being reachable — isolated and continue-on-error, an AUR outage
  # cannot fail the release. Recover a missed publish with the aur-publish
  # workflow (workflow_dispatch).
  aur-publish:
    name: Publish to AUR
    needs: [release]
    if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-')
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Shared with the aur-publish workflow's recovery runs. Without this, a
    # recovery that already passed its version check could clone after a newer
    # automatic publish landed and push the older PKGBUILD as a fast-forward.
    concurrency:
      group: aur-publish
      cancel-in-progress: false
    environment: release
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check AUR publishing configuration
        id: aur-config
        env:
          AUR_KEY: ${{ secrets.AUR_KEY }}
        run: |
          if [ -n "$AUR_KEY" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to AUR
        if: steps.aur-config.outputs.enabled == 'true'
        env:
          AUR_KEY: ${{ secrets.AUR_KEY }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p ~/.ssh
          echo "$AUR_KEY" > ~/.ssh/aur
          chmod 600 ~/.ssh/aur
          echo -e "Host aur.archlinux.org\n  IdentityFile ~/.ssh/aur\n  User aur\n  StrictHostKeyChecking accept-new" >> ~/.ssh/config
          git config --global user.name "37signals"
          git config --global user.email "dev@37signals.com"
          # publish-aur.sh derives everything from the published release assets
          # and no-ops when the PKGBUILD is already current, so retrying is safe.
          for attempt in 1 2 3; do
            if scripts/publish-aur.sh "$VERSION"; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "AUR publish attempt ${attempt} failed; retrying in $((attempt * 60))s"
              sleep $((attempt * 60))
            fi
          done
          echo "AUR publish failed after 3 attempts"
          exit 1

      - name: Notify on AUR publish failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO_SLUG: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
          RUN_ID: ${{ github.run_id }}
        run: |
          RUN_URL="https://github.com/${REPO_SLUG}/actions/runs/${RUN_ID}"
          BODY="Publishing [${REF_NAME}](${RUN_URL}) to the AUR failed. The GitHub release is unaffected — only the Arch package is stale. Re-run the \`Publish to AUR\` workflow with version \`${REF_NAME#v}\` once the AUR is reachable."

          # Dedup lives in notify-issue.sh, shared with aur-publish.yml, keyed
          # on the aur-publish label rather than the title so a retitled issue
          # does not spawn a duplicate.
          notify_status=0
          scripts/notify-issue.sh \
            --repo "$REPO_SLUG" \
            --label aur-publish \
            --title "AUR publish failure" \
            --body "$BODY" || notify_status=$?

          echo "::error::AUR publish failed for ${REF_NAME}. See ${RUN_URL}"
          exit "$notify_status"

  sync-skills:
    name: Sync skills
    needs: [release]
    if: startsWith(github.ref, 'refs/tags/v')
    continue-on-error: true
    concurrency:
      group: sync-skills
      cancel-in-progress: false
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Generate token for skills repo
        id: skills-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: basecamp
          repositories: skills
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write

      - name: Sync skills to distribution repo
        id: sync
        env:
          SKILLS_TOKEN: ${{ steps.skills-token.outputs.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          SOURCE_SHA: ${{ github.sha }}
        run: scripts/sync-skills.sh

      - name: Notify on sync failure
        if: failure()
        env:
          GH_TOKEN: ${{ steps.skills-token.outputs.token }}
          REF_NAME: ${{ github.ref_name }}
          RUN_ID: ${{ github.run_id }}
        run: |
          TITLE="Skills sync failure"
          BODY="The automatic skills sync from [hey-cli ${REF_NAME}](https://github.com/basecamp/hey-cli/actions/runs/${RUN_ID}) failed. Check the workflow run for details."
          existing=$(gh issue list --repo basecamp/skills --state open --search "in:title $TITLE" --json number,title --jq '[.[] | select(.title == "'"$TITLE"'")][0].number // empty' 2>/dev/null || true)
          if [ -n "$existing" ]; then
            gh issue comment --repo basecamp/skills "$existing" --body "$BODY" || true
          else
            gh issue create --repo basecamp/skills --title "$TITLE" --body "$BODY" || true
          fi
          echo "::error::Skills sync to basecamp/skills failed for ${REF_NAME}. See https://github.com/basecamp/hey-cli/actions/runs/${RUN_ID}"
