name: Release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  security:
    name: Security scan
    uses: ./.github/workflows/security.yml
    permissions:
      contents: read
      security-events: write

  # Run here rather than trusting the PR gate: scripts/release.sh will commit
  # release-prep changes to main before tagging, so anything run ahead of time
  # covers the wrong SHA. This job runs against the exact tag SHA.
  test:
    name: Test before release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      HEY_NO_KEYRING: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        # zizmor: ignore[cache-poisoning] -- cache is branch-isolated; fork PRs cannot write to the cache used by tag-push workflows
        with:
          go-version-file: go.mod

      - name: Install golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.11.1  # keep in lockstep with test.yml Lint
          install-only: true

      - name: Cache BATS
        id: cache-bats
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        # zizmor: ignore[cache-poisoning] -- cache is branch-isolated; fork PRs cannot write to the cache used by tag-push workflows
        with:
          path: ~/.local
          key: bats-1.11.0-home

      - name: Install BATS
        if: steps.cache-bats.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch v1.11.0 https://github.com/bats-core/bats-core.git /tmp/bats-core
          /tmp/bats-core/install.sh ~/.local

      - name: Add BATS to PATH
        run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Run release quality gate
        run: |
          make check-release-lockstep fmt-check vet lint test test-e2e tidy-check check-surface
          go test -race -count=1 ./...

      - name: Run govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      # .surface is committed, so the baseline is `git show <prev tag>:.surface`
      # — no second checkout or build. Removals fail unless acknowledged in
      # .surface-breaking.
      - name: Check CLI surface compatibility
        run: scripts/check-surface-compat.sh

  # Pull-request CI catches flake and vendorHash drift where source and
  # dependencies change. This final build covers the exact stable tag —
  # including release.sh's version-only metadata commit — before GoReleaser
  # publishes anything. Prereleases deliberately retain the latest stable Nix
  # metadata, so their gate is an explicit no-op.
  nix-verify:
    name: Verify Nix flake before release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Skip prerelease
        if: ${{ contains(github.ref_name, '-') }}
        run: echo "Prerelease — leaving stable Nix metadata unchanged"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ !contains(github.ref_name, '-') }}
        with:
          persist-credentials: false

      - name: Install Nix
        if: ${{ !contains(github.ref_name, '-') }}
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1

      # The metadata hooks read the version stamps; this proves the flake's
      # built artifact agrees with the tag before the release is public.
      - name: Build and verify
        if: ${{ !contains(github.ref_name, '-') }}
        env:
          TAG: ${{ github.ref_name }}
        run: |
          STORE_PATH=$(nix build --no-link --print-out-paths)
          out=$("$STORE_PATH/bin/hey" --version)
          echo "$out"
          [ "$out" = "hey version ${TAG#v}" ] || {
            echo "::error::Nix flake built ${out#hey version }, expected ${TAG#v}. nix/package.nix was not bumped before tagging."
            exit 1
          }

  release:
    name: Release
    needs: [test, security, nix-verify]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
      # Dispatch the upgrade smoke: goreleaser publishes with GITHUB_TOKEN,
      # whose release event does not start other workflows.
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Generate token for Homebrew tap
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: basecamp
          repositories: homebrew-tap
          permission-contents: write

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        # zizmor: ignore[cache-poisoning] -- cache is branch-isolated; fork PRs cannot write to this cache
        with:
          go-version-file: go.mod

      - name: Verify tag is on main
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Install Syft
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0

      # Fail fast: goreleaser's notarize block turns itself off when any of
      # these secrets is empty, so without this check a misconfigured canonical
      # run would ship an unsigned macOS binary instead of failing. Gated to
      # the canonical repo only because forks have none of these secrets;
      # a tag pushed to a fork is not a supported release path (the tap-token
      # step above needs the release app as well).
      - name: Verify macOS signing secrets
        if: github.repository == 'basecamp/hey-cli'
        run: |
          missing=()
          for var in MACOS_SIGN_P12 MACOS_SIGN_PASSWORD MACOS_NOTARY_KEY MACOS_NOTARY_KEY_ID MACOS_NOTARY_ISSUER_ID; do
            if [ -z "${!var}" ]; then
              missing+=("$var")
            fi
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing macOS signing secrets: ${missing[*]}"
            exit 1
          fi
          echo "All macOS signing secrets present"
        env:
          MACOS_SIGN_P12: ${{ secrets.MACOS_SIGN_P12 }}
          MACOS_SIGN_PASSWORD: ${{ secrets.MACOS_SIGN_PASSWORD }}
          MACOS_NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}

      - name: Verify Windows signing secrets
        if: github.repository == 'basecamp/hey-cli'
        run: |
          missing=()
          for var in SM_API_KEY SM_CLIENT_CERT_FILE_B64 SM_CLIENT_CERT_PASSWORD; do
            if [ -z "${!var}" ]; then
              missing+=("$var")
            fi
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing Windows signing secrets: ${missing[*]}"
            exit 1
          fi
          echo "All Windows signing secrets present"
        env:
          SM_API_KEY: ${{ secrets.SM_API_KEY }}
          SM_CLIENT_CERT_FILE_B64: ${{ secrets.SM_CLIENT_CERT_FILE_B64 }}
          SM_CLIENT_CERT_PASSWORD: ${{ secrets.SM_CLIENT_CERT_PASSWORD }}

      - name: Set up Java for jsign
        if: github.repository == 'basecamp/hey-cli'
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '21'

      # Guarded like the preflight above: on forks this must not run at all —
      # decoding an empty secret would export a nonempty SM_CLIENT_CERT_FILE,
      # which the wrapper correctly treats as partial configuration and fails.
      # With no SM_* env exported, forks take the wrapper's skip path instead
      # and release unsigned.
      - name: Prepare Windows signing
        if: github.repository == 'basecamp/hey-cli'
        env:
          SM_CLIENT_CERT_FILE_B64: ${{ secrets.SM_CLIENT_CERT_FILE_B64 }}
        run: |
          # jsign >= 7.5 is mandatory: 7.1-7.3 are broken against DigiCert
          # ONE's current API.
          JSIGN_VERSION=7.5
          JSIGN_SHA256=602a51c3545a6dc4fb99bd2ea7152b26d1345916d0c93ddfbd5936cb735af91c
          umask 077
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/jsign-$JSIGN_VERSION.jar" \
            "https://github.com/ebourg/jsign/releases/download/$JSIGN_VERSION/jsign-$JSIGN_VERSION.jar"
          echo "$JSIGN_SHA256  $RUNNER_TEMP/jsign-$JSIGN_VERSION.jar" | sha256sum -c -
          printf '%s' "$SM_CLIENT_CERT_FILE_B64" | base64 -d > "$RUNNER_TEMP/digicert-client-cert.p12"
          {
            echo "JSIGN_JAR=$RUNNER_TEMP/jsign-$JSIGN_VERSION.jar"
            echo "SM_CLIENT_CERT_FILE=$RUNNER_TEMP/digicert-client-cert.p12"
          } >> "$GITHUB_ENV"

      - name: Install GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          # Keep in sync with .mise.toml goreleaser version pin.
          version: 'v2.15.4'
          install-only: true

      - name: Resolve the previous stable tag for release notes
        run: |
          # Stable releases must diff against the last STABLE tag, not the last
          # rc, or the notes come out empty.
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            echo "prerelease — leaving previous-tag detection to goreleaser"
            exit 0
          fi
          PREV=$(git tag --merged "$GITHUB_SHA" --sort=-version:refname \
                   --list 'v[0-9]*.[0-9]*.[0-9]*' \
                 | awk -v cur="$GITHUB_REF_NAME" '!/-/ && $0 != cur { print; exit }')
          [ -n "$PREV" ] || { echo "::error::no previous stable tag resolved"; exit 1; }
          echo "Release notes will diff against $PREV"
          echo "GORELEASER_PREVIOUS_TAG=$PREV" >> "$GITHUB_ENV"

      - name: Run GoReleaser
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ steps.app-token.outputs.token }}
          MACOS_SIGN_P12: ${{ secrets.MACOS_SIGN_P12 }}
          MACOS_SIGN_PASSWORD: ${{ secrets.MACOS_SIGN_PASSWORD }}
          MACOS_NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
          # Windows Authenticode signing via DigiCert KeyLocker (jsign).
          # JSIGN_JAR and SM_CLIENT_CERT_FILE arrive via GITHUB_ENV from the
          # "Prepare Windows signing" step above.
          SM_API_KEY: ${{ secrets.SM_API_KEY }}
          SM_CLIENT_CERT_PASSWORD: ${{ secrets.SM_CLIENT_CERT_PASSWORD }}
          # DigiCert ONE certificate ID (not the keypair alias) for the OV cert
          # CN=37signals LLC, expires 2027-04-30. Shared with basecamp-cli and
          # bc3-desktop. The ID is a valid jsign --alias: DigiCertOneSigningService
          # accepts the certificate's id or alias (hex-and-dash values query
          # certificates?id=) and derives the keypair from the certificate record.
          SIGN_ALIAS: 1346fa41-d9f0-4580-b7b9-a95cf5674354
        run: goreleaser release --clean

      # The gate itself runs as a goreleaser build hook (.goreleaser.yaml),
      # before archives, signing and publishing; this pass over dist/ is the
      # consolidated per-platform table for the job summary.
      - name: Clean up Windows signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/digicert-client-cert.p12" "$RUNNER_TEMP"/jsign-*.jar

      - name: Report release size budget
        run: scripts/check-size-budget.sh

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: ./dist/checksums.txt

      # A release published with the built-in GITHUB_TOKEN does not fire the
      # `release: published` trigger (GitHub suppresses workflow-to-workflow
      # events except workflow_dispatch/repository_dispatch), so start the
      # upgrade smoke explicitly, pinned to this release. The tag ref makes
      # the smoke run this release's installers, not main's.
      - name: Trigger the upgrade smoke against this release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run upgrade-smoke.yml --repo "$GITHUB_REPOSITORY" \
            --ref "$GITHUB_REF_NAME" -f version="${GITHUB_REF_NAME#v}"

  # The AUR goes down for maintenance often enough that a release must not
  # depend on it being reachable — isolated and continue-on-error, an AUR outage
  # cannot fail the release. Recover a missed publish with the aur-publish
  # workflow (workflow_dispatch).
  aur-publish:
    name: Publish to AUR
    needs: [release]
    if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-')
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Shared with the aur-publish workflow's recovery runs. Without this, a
    # recovery that already passed its version check could clone after a newer
    # automatic publish landed and push the older PKGBUILD as a fast-forward.
    concurrency:
      group: aur-publish
      cancel-in-progress: false
    environment: release
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check AUR publishing configuration
        id: aur-config
        env:
          AUR_KEY: ${{ secrets.AUR_KEY }}
        run: |
          if [ -n "$AUR_KEY" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      # Its own step so a key that does not load fails here, named, instead of
      # surfacing three attempts later as "Permission denied (publickey)" and
      # filing an AUR-outage issue for what is a secrets problem.
      - name: Install AUR key
        if: steps.aur-config.outputs.enabled == 'true'
        env:
          SSH_KEY: ${{ secrets.AUR_KEY }}
        run: |
          mkdir -p ~/.ssh
          scripts/install-ssh-key.sh ~/.ssh/aur
          echo -e "Host aur.archlinux.org\n  IdentityFile ~/.ssh/aur\n  User aur\n  StrictHostKeyChecking accept-new" >> ~/.ssh/config

      - name: Publish to AUR
        id: publish
        if: steps.aur-config.outputs.enabled == 'true'
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          git config --global user.name "37signals"
          git config --global user.email "dev@37signals.com"
          # publish-aur.sh derives everything from the published release assets
          # and no-ops when the PKGBUILD is already current, so retrying is safe.
          for attempt in 1 2 3; do
            if scripts/publish-aur.sh "$VERSION"; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "AUR publish attempt ${attempt} failed; retrying in $((attempt * 60))s"
              sleep $((attempt * 60))
            fi
          done
          echo "AUR publish failed after 3 attempts"
          exit 1

      # Scoped to the publish step, as in aur-publish.yml: a key that fails to
      # load is an operator problem the run annotates itself, not the outage
      # this issue's "retry once the AUR is reachable" advice is written for.
      - name: Notify on AUR publish failure
        if: failure() && steps.publish.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO_SLUG: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
          RUN_ID: ${{ github.run_id }}
        run: |
          RUN_URL="https://github.com/${REPO_SLUG}/actions/runs/${RUN_ID}"
          BODY="Publishing [${REF_NAME}](${RUN_URL}) to the AUR failed. The GitHub release is unaffected — only the Arch package is stale. Re-run the \`Publish to AUR\` workflow with version \`${REF_NAME#v}\` once the AUR is reachable."

          # Dedup lives in notify-issue.sh, shared with aur-publish.yml, keyed
          # on the aur-publish label rather than the title so a retitled issue
          # does not spawn a duplicate.
          notify_status=0
          scripts/notify-issue.sh \
            --repo "$REPO_SLUG" \
            --label aur-publish \
            --title "AUR publish failure" \
            --body "$BODY" || notify_status=$?

          echo "::error::AUR publish failed for ${REF_NAME}. See ${RUN_URL}"
          exit "$notify_status"

  macos-verify:
    name: Verify macOS signing
    needs: [release]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-latest
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - name: Download release binary
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/verify
          gh release download "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "hey_*_darwin_${{ matrix.arch }}.tar.gz" \
            --dir /tmp/verify
          tar -xzf /tmp/verify/hey_*_darwin_${{ matrix.arch }}.tar.gz -C /tmp/verify

      - name: Verify TeamIdentifier
        run: |
          TEAM_ID=$(codesign -dv --verbose=4 /tmp/verify/hey 2>&1 | grep TeamIdentifier= | cut -d= -f2)
          echo "TeamIdentifier (${{ matrix.arch }}): $TEAM_ID"
          if [ "$TEAM_ID" != "2WNYUYRS7G" ]; then
            echo "::error::TeamIdentifier mismatch (${{ matrix.arch }}): expected 2WNYUYRS7G, got $TEAM_ID"
            exit 1
          fi

      - name: Verify hardened runtime
        run: |
          FLAGS=$(codesign -dv --verbose=4 /tmp/verify/hey 2>&1 | grep 'flags=' | head -1)
          echo "Flags (${{ matrix.arch }}): $FLAGS"
          if ! echo "$FLAGS" | grep -q 'runtime'; then
            echo "::error::Hardened runtime flag not set (${{ matrix.arch }}): $FLAGS"
            exit 1
          fi

      - name: Check notarization status
        run: |
          # Best-effort: notarization ticket propagation can lag, so this is
          # telemetry, not a gate. TeamIdentifier and hardened runtime above
          # are the hard assertions.
          # spctl exits non-zero on rejection; capture the status so the
          # pipeline does not trip -e/pipefail before the branch below runs.
          spctl -a -vvv -t install /tmp/verify/hey > /tmp/verify/spctl.out 2>&1 || true
          cat /tmp/verify/spctl.out
          if grep -q 'accepted\|Notarized Developer ID' /tmp/verify/spctl.out; then
            echo "Notarization accepted for ${{ matrix.arch }}"
          else
            echo "::warning::Notarization not yet accepted for ${{ matrix.arch }} (ticket propagation may lag)"
          fi

  windows-verify:
    name: Verify Windows signing
    needs: [release]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - name: Download release binary
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "$env:RUNNER_TEMP\verify" | Out-Null
          gh release download $env:GITHUB_REF_NAME `
            --repo $env:GITHUB_REPOSITORY `
            --pattern "hey_*_windows_${{ matrix.arch }}.zip" `
            --dir "$env:RUNNER_TEMP\verify"
          if ($LASTEXITCODE -ne 0) { throw 'gh release download failed' }
          $zip = Get-ChildItem "$env:RUNNER_TEMP\verify\hey_*_windows_${{ matrix.arch }}.zip"
          Expand-Archive -Path $zip.FullName -DestinationPath "$env:RUNNER_TEMP\verify\extract" -Force

      - name: Verify Authenticode signature
        shell: pwsh
        run: |
          # Signature validation of an arm64 PE needs no execution, so both
          # arches verify on the x64 runner.
          $sig = Get-AuthenticodeSignature "$env:RUNNER_TEMP\verify\extract\hey.exe"
          Write-Host "Status (${{ matrix.arch }}): $($sig.Status) - $($sig.StatusMessage)"
          Write-Host "Signer: $($sig.SignerCertificate.Subject)"
          if ($sig.Status -ne 'Valid') {
            Write-Host "::error::Authenticode status (${{ matrix.arch }}): $($sig.Status) - $($sig.StatusMessage)"
            exit 1
          }
          if ($sig.SignerCertificate.Subject -notmatch 'CN=37signals LLC') {
            Write-Host "::error::Unexpected signer (${{ matrix.arch }}): $($sig.SignerCertificate.Subject)"
            exit 1
          }
          if (-not $sig.TimeStamperCertificate) {
            Write-Host "::error::No timestamp countersignature (${{ matrix.arch }}) - signature would expire with the cert on 2027-04-30"
            exit 1
          }
          Write-Host "Signature valid, signer and timestamp verified (${{ matrix.arch }})"

      - name: Download installer asset
        if: matrix.arch == 'amd64'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release download $env:GITHUB_REF_NAME `
            --repo $env:GITHUB_REPOSITORY `
            --pattern 'hey_installer.ps1' `
            --dir "$env:RUNNER_TEMP\verify"
          if ($LASTEXITCODE -ne 0) { throw 'gh release download failed' }

      # Both engines: confirms jsign's ps1 content-hash encoding matches what
      # PowerShell computes, on Core and on Windows PowerShell 5.1.
      - name: Verify installer signature (pwsh)
        if: matrix.arch == 'amd64'
        shell: pwsh
        run: |
          $sig = Get-AuthenticodeSignature "$env:RUNNER_TEMP\verify\hey_installer.ps1"
          Write-Host "Installer status (pwsh): $($sig.Status) - $($sig.StatusMessage)"
          if ($sig.Status -ne 'Valid') { exit 1 }

      - name: Verify installer signature (Windows PowerShell 5.1)
        if: matrix.arch == 'amd64'
        shell: powershell
        run: |
          $sig = Get-AuthenticodeSignature "$env:RUNNER_TEMP\verify\hey_installer.ps1"
          Write-Host "Installer status (powershell): $($sig.Status) - $($sig.StatusMessage)"
          if ($sig.Status -ne 'Valid') { exit 1 }

  sync-skills:
    name: Sync skills
    needs: [release]
    if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-')
    continue-on-error: true
    concurrency:
      group: sync-skills
      cancel-in-progress: false
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Generate token for skills repo
        id: skills-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: basecamp
          repositories: skills
          permission-contents: write

      - name: Sync skills to distribution repo
        id: sync
        env:
          SKILLS_TOKEN: ${{ steps.skills-token.outputs.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          SOURCE_SHA: ${{ github.sha }}
        run: scripts/sync-skills.sh

      - name: Notify on sync failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO_SLUG: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
          RUN_ID: ${{ github.run_id }}
        run: |
          RUN_URL="https://github.com/${REPO_SLUG}/actions/runs/${RUN_ID}"
          BODY="The automatic skills sync to basecamp/skills for [${REF_NAME}](${RUN_URL}) failed. Check the workflow run for details; rerun the failed jobs in that run once fixed."

          # Filed on this repo (the only one github.token can write to), deduped
          # by label via notify-issue.sh so a retitled issue does not spawn a
          # duplicate.
          notify_status=0
          scripts/notify-issue.sh \
            --repo "$REPO_SLUG" \
            --label skills-sync \
            --title "Skills sync failure" \
            --body "$BODY" || notify_status=$?

          echo "::error::Skills sync to basecamp/skills failed for ${REF_NAME}. See ${RUN_URL}"
          exit "$notify_status"
