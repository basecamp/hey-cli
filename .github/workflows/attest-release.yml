# Manual build-provenance attestation, for a release whose run published the
# assets but never reached release.yml's "Attest build provenance" step.
#
# v1.7.0 is the case this exists for: the size report after goreleaser failed,
# the steps behind it were skipped, and the release shipped without
# attestations. mise requires them once an earlier version of a tool had them,
# so `mise upgrade` and `hey upgrade` via mise refused the release (#499).
# Re-running the release job is no answer: goreleaser would either refuse the
# existing release or rebuild and re-sign, and the new binaries would not be
# the bytes users download.
#
# This workflow attests the published assets and nothing else. checksums.txt is
# the list of subjects handed to attest-build-provenance, not a subject itself.
# It is trusted only after the release run's own cosign bundle verifies against
# release.yml at the tag, and each listed digest only if the published asset of
# that name carries it. The attestation's signer is this workflow rather than
# release.yml; mise does not pin the signer workflow, and the installers and
# `hey upgrade`'s own verification do not read attestations at all.
name: Attest a published release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Published release tag to attest (e.g. v1.7.0)'
        required: true
        type: string

permissions: {}

concurrency:
  group: attest-release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  attest:
    name: Attest build provenance
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Validate tag input
        env:
          TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Invalid tag '${TAG}' — expected a release tag such as v1.7.0"
            exit 1
          fi
          # A draft's assets are not what anyone downloads, so there is
          # nothing there to attest yet.
          draft=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" --jq '.draft' 2>/dev/null) || {
            echo "::error::No published release found for ${TAG}"
            exit 1
          }
          if [ "$draft" != "false" ]; then
            echo "::error::${TAG} is a draft release"
            exit 1
          fi

      - name: Download the release's checksums and their signature
        env:
          TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern checksums.txt --pattern checksums.txt.bundle

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # The same identity the installers and `hey upgrade` pin: only the
      # assets listed in a checksums.txt the release run for this tag signed
      # are attested.
      - name: Verify checksums.txt was signed by the release run
        env:
          TAG: ${{ inputs.tag }}
        run: |
          cosign verify-blob checksums.txt \
            --bundle checksums.txt.bundle \
            --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@refs/tags/${TAG}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com

      - name: Verify every checksum matches the published asset
        env:
          TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" \
            --jq '.assets[] | select(.digest != null) | "\(.digest | ltrimstr("sha256:"))  \(.name)"' \
            | sort > published.txt
          sort checksums.txt > signed.txt
          missing=$(comm -23 signed.txt published.txt)
          if [ -n "$missing" ]; then
            echo "::error::checksums.txt lists entries no published asset matches:"
            echo "$missing"
            exit 1
          fi
          echo "All $(wc -l < signed.txt) signed checksums match published assets"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: ./checksums.txt
